<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;max-width:420px;margin:30px auto;padding:0 12px}.box{border:1px solid #333;padding:16px}input,button{padding:6px;margin:4px 0}#kq{font-size:1.2em;margin-top:12px}</style><title>Giá hoa quả</title></head><body><div class="box"><h2>Giá hoa quả</h2>
<input id="ten_hoa_qua" placeholder="Nhập tên hoa quả"> <button id="btn">Xem giá</button>
<div id="kq"></div></div>
<script>
document.getElementById("btn").onclick=function(){
  const ten=document.getElementById("ten_hoa_qua").value.trim().toLowerCase();
  let gia;
  switch(ten){
    case "ổi":case "dưa hấu":gia="20000 VNĐ/kg";break;
    case "táo":gia="30000 VNĐ/kg";break;
    case "cam":case "chôm chôm":gia="40000 VNĐ/kg";break;
    case "măng cụt":gia="50000 VNĐ/kg";break;
    default:gia="Tìm không thấy";
  }
  document.getElementById("kq").textContent=gia;
};
</script></body></html>
