<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;max-width:420px;margin:30px auto;padding:0 12px}.box{border:1px solid #333;padding:16px}input,button{padding:6px;margin:4px 0}#kq{font-size:1.2em;margin-top:12px}</style><title>Tính số ngày trong tháng</title></head><body><div class="box">
<input id="thang" type="number" placeholder="Tháng (1-12)"> <button id="btn">Tính số ngày</button>
<div id="kq"></div></div>
<script>
document.getElementById("btn").onclick=function(){
  const t=parseInt(document.getElementById("thang").value);
  let kq;
  switch(t){
    case 1:case 3:case 5:case 7:case 8:case 10:case 12:kq="Tháng "+t+" có 31 ngày";break;
    case 4:case 6:case 9:case 11:kq="Tháng "+t+" có 30 ngày";break;
    case 2:kq="Tháng 2 có 28 hoặc 29 ngày";break;
    default:kq="Tháng không hợp lệ (nhập 1-12)";
  }
  document.getElementById("kq").textContent=kq;
};
</script></body></html>
